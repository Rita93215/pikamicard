<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D4E8F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="明信片互動" />
  <title>好友明信片互動計數</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #D4E8F0;
      --ink: #2B3A4A;
      --stamp-red: #C0392B;
      --postmark: #7A8B99;
      --paper: #FBF7EE;
      --accent-teal: #4A8FA0;
      --line: #C9BFA5;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      height: 100dvh;
      background: var(--sky);
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(200,230,240,0.5) 0%, transparent 40%);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Noto Sans TC', sans-serif;
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px);
      gap: 6px;
    }

    h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: 0.85rem;
      color: var(--postmark);
      letter-spacing: 0.1em;
      font-weight: 700;
      flex-shrink: 0;
    }

    .hint {
      font-size: 0.6rem;
      color: var(--postmark);
      background: rgba(255,255,255,0.5);
      border-radius: 50px;
      padding: 3px 12px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    /* ── Grid: 5 columns, fills remaining height ── */
    .friends-grid {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      /* auto rows that fill available space */
      grid-auto-rows: 1fr;
      gap: 5px;
      overflow: hidden; /* no scroll */
      min-height: 0;
    }

    .friend-card {
      background: white;
      border-radius: 8px;
      padding: 6px 4px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 0 1px 4px rgba(43,58,74,0.09);
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
      user-select: none;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .friend-card:hover { border-color: var(--accent-teal); transform: translateY(-1px); }
    .friend-card:active { transform: scale(0.92); }

    .friend-name {
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--ink);
      text-align: center;
      word-break: break-word;
      line-height: 1.2;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .friend-count {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-teal);
      line-height: 1;
    }

    .friend-count-label {
      font-size: 0.45rem;
      color: var(--postmark);
    }

    .edit-icon {
      position: absolute;
      top: 2px; right: 3px;
      font-size: 0.5rem;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .friend-card:hover .edit-icon { opacity: 0.5; }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(74,143,160,0.2);
      transform: scale(0);
      animation: ripple-anim 0.4s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple-anim { to { transform: scale(6); opacity: 0; } }

    /* Add button */
    .add-btn {
      width: 100%;
      max-width: 600px;
      flex-shrink: 0;
      background: white;
      color: var(--accent-teal);
      border: 2px dashed var(--accent-teal);
      border-radius: 8px;
      padding: 7px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .add-btn:hover { background: #EEF7FA; }
    .add-btn:active { transform: scale(0.98); }

    /* ── Modals ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(43,58,74,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--paper);
      border-radius: 14px;
      padding: 22px 18px 16px;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 12px 40px rgba(43,58,74,0.25);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .modal h2 { font-family: 'Noto Serif TC', serif; font-size: 0.95rem; color: var(--ink); font-weight: 700; }

    .modal input {
      width: 100%;
      padding: 9px 13px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.88rem;
      color: var(--ink);
      background: white;
      outline: none;
      transition: border-color 0.15s;
    }

    .modal input:focus { border-color: var(--accent-teal); }
    .modal-btns { display: flex; gap: 7px; }

    .modal-delete { background: none; border: 1.5px solid #E0C0BB; border-radius: 50px; padding: 7px 11px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.72rem; color: var(--stamp-red); cursor: pointer; }
    .modal-delete:hover { background: #FDF0EE; }
    .modal-cancel { background: none; border: 1.5px solid var(--line); border-radius: 50px; padding: 7px 11px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.72rem; color: var(--postmark); cursor: pointer; margin-left: auto; }
    .modal-confirm { background: var(--accent-teal); border: none; border-radius: 50px; padding: 7px 15px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.72rem; color: white; cursor: pointer; }
    .modal-confirm:hover { background: #357A8A; }

    .count-adjuster {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      border-radius: 10px;
      padding: 9px 12px;
      border: 1.5px solid var(--line);
    }

    .adj-btn { width: 34px; height: 34px; border-radius: 50%; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
    .adj-btn.minus { background: #FDF0EE; color: var(--stamp-red); }
    .adj-btn.minus:active { transform: scale(0.88); }
    .adj-btn.plus { background: #EEF7FA; color: var(--accent-teal); }
    .adj-btn.plus:active { transform: scale(0.88); }

    .adj-count { font-family: 'Noto Serif TC', serif; font-size: 1.5rem; font-weight: 700; color: var(--accent-teal); min-width: 38px; text-align: center; line-height: 1; }
    .adj-label { font-size: 0.72rem; color: var(--postmark); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: white;
      padding: 9px 8px 9px 16px;
      border-radius: 50px;
      font-size: 0.75rem;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      white-space: nowrap;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 9px;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }

    .toast-undo { background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.35); border-radius: 50px; padding: 3px 11px; font-size: 0.7rem; font-weight: 600; color: white; cursor: pointer; }
    .toast-timer { width: 18px; height: 18px; flex-shrink: 0; }
    .toast-timer circle { fill: none; stroke: rgba(255,255,255,0.25); stroke-width: 2.5; }
    .toast-timer .progress { stroke: rgba(255,255,255,0.85); stroke-dasharray: 50.3; stroke-dashoffset: 0; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  </style>
</head>
<body>

  <h1>好友明信片互動記錄</h1>
  <p class="hint">點擊 ＋1（3秒內可撤銷）・長按可編輯／刪除</p>

  <div class="friends-grid" id="friends-grid"></div>
  <button class="add-btn" id="add-btn">＋ 新增好友</button>

  <div class="modal-backdrop" id="add-modal">
    <div class="modal">
      <h2>新增好友</h2>
      <input type="text" id="add-input" placeholder="輸入好友名稱…" maxlength="20" />
      <div class="modal-btns">
        <button class="modal-cancel" id="add-cancel">取消</button>
        <button class="modal-confirm" id="add-confirm">新增</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="edit-modal">
    <div class="modal">
      <h2>編輯好友</h2>
      <input type="text" id="edit-input" placeholder="好友名稱…" maxlength="20" />
      <div class="count-adjuster">
        <button class="adj-btn minus" id="adj-minus">－</button>
        <span class="adj-count" id="adj-count">0</span>
        <span class="adj-label">次</span>
        <button class="adj-btn plus" id="adj-plus">＋</button>
      </div>
      <div class="modal-btns">
        <button class="modal-delete" id="edit-delete">🗑 刪除</button>
        <button class="modal-cancel" id="edit-cancel">取消</button>
        <button class="modal-confirm" id="edit-confirm">儲存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toast-msg"></span>
    <button class="toast-undo" id="toast-undo">撤銷</button>
    <svg class="toast-timer" id="toast-timer" viewBox="0 0 18 18">
      <circle cx="9" cy="9" r="8"/>
      <circle class="progress" id="toast-progress" cx="9" cy="9" r="8"/>
    </svg>
  </div>

<script>
  /* ── Inline Manifest ── */
  const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#4A8FA0"/><text x="96" y="130" font-size="100" text-anchor="middle" fill="white">📬</text></svg>`;
  const iconUrl = URL.createObjectURL(new Blob([ICON_SVG], {type:'image/svg+xml'}));
  const manifest = { name:'好友明信片互動記錄', short_name:'明信片互動', start_url: location.href, display:'standalone', orientation:'portrait', background_color:'#D4E8F0', theme_color:'#D4E8F0', icons:[{src:iconUrl,sizes:'192x192',type:'image/svg+xml',purpose:'any maskable'}] };
  const mLink = document.createElement('link'); mLink.rel='manifest'; mLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'})); document.head.appendChild(mLink);
  const aLink = document.createElement('link'); aLink.rel='apple-touch-icon'; aLink.href=iconUrl; document.head.appendChild(aLink);

  /* ── Inline SW ── */
  const swCode = `const C='postcard-v1';self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(c=>{if(c)return c;return fetch(e.request).then(r=>{if(e.request.method==='GET')caches.open(C).then(cc=>cc.put(e.request,r.clone()));return r}).catch(()=>c)}))})`;
  if('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'})),{type:'classic'}).catch(()=>{});

  /* ── Prevent body scroll ── */
  document.addEventListener('touchmove', e => {
    if (!e.target.closest('.modal')) e.preventDefault();
  }, { passive: false });

  /* ── State ── */
  const ALL_FRIENDS = [
    'Alice li','Shan','Ann','請支援輸贏','淇淇','恭喜發財',
    'Kelly Chou','Mini醬','花格格','Royceee','長安','Bunny',
    'Lai','Tsubasa','佩怡','場場原價前排票','Je','Fannie Chen',
    'Mico','脆脆彩椒','高高','艾茉莉','RRoYY','高速婆婆',
    'Olivia','Cida','Bing','Alice Hn','左手香','Yuty',
    'Ang','糰萌','NESSA','Kathie','ななこ','Pei Fen',
    'Ann','Cathy','Yuna','3D','Maymay','Pablo','林Lin','MM','芙莉蓮'
  ];

  const STORAGE_KEY = 'postcard_v4';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    const friends = ALL_FRIENDS.map((name, i) => ({ id: 'f' + i, name }));
    const counts = {};
    friends.forEach(f => { counts[f.id] = 0; });
    return { friends, counts };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  let state = loadState();
  let editingId = null;
  const grid = document.getElementById('friends-grid');

  /* ── Dynamic grid rows to fit screen ── */
  function setGridRows() {
    const count = state.friends.length;
    const cols = 5;
    const rows = Math.ceil(count / cols);
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  }

  /* ── Render ── */
  function renderFriends() {
    grid.innerHTML = '';
    setGridRows();
    state.friends.forEach(f => {
      const card = document.createElement('div');
      card.className = 'friend-card';
      card.innerHTML = `
        <span class="edit-icon">✏️</span>
        <span class="friend-name">${f.name}</span>
        <span class="friend-count">${state.counts[f.id] || 0}</span>
        <span class="friend-count-label">次</span>
      `;

      let pressTimer = null, didLongPress = false;
      card.addEventListener('pointerdown', () => {
        didLongPress = false;
        pressTimer = setTimeout(() => { didLongPress = true; openEdit(f.id); }, 600);
      });
      card.addEventListener('pointerup', () => clearTimeout(pressTimer));
      card.addEventListener('pointerleave', () => clearTimeout(pressTimer));
      card.addEventListener('click', e => {
        if (didLongPress) return;
        addRipple(card, e);
        state.counts[f.id] = (state.counts[f.id] || 0) + 1;
        saveState(); renderFriends();
        showUndoToast(f.id, f.name);
      });
      grid.appendChild(card);
    });
  }

  function addRipple(el, e) {
    const rect = el.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${(e.clientX??rect.left+rect.width/2)-rect.left-size/2}px;top:${(e.clientY??rect.top+rect.height/2)-rect.top-size/2}px`;
    el.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  /* ── Undo Toast ── */
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');
  const toastUndo = document.getElementById('toast-undo');
  const toastProgress = document.getElementById('toast-progress');
  const UNDO_MS = 3000, CIRC = 50.3;
  let undoState = null, undoRaf = null, undoTimer = null, undoStart = null;

  function showUndoToast(friendId, friendName) {
    undoState = { friendId, prevCount: (state.counts[friendId] || 1) - 1 };
    toastMsg.textContent = `${friendName} ＋1 🎉`;
    toastUndo.style.display = ''; document.getElementById('toast-timer').style.display = '';
    toast.classList.add('show');
    toastProgress.style.strokeDashoffset = 0;
    clearTimeout(undoTimer); cancelAnimationFrame(undoRaf);
    undoStart = performance.now();
    (function tick(now) {
      const r = Math.min((now - undoStart) / UNDO_MS, 1);
      toastProgress.style.strokeDashoffset = CIRC * r;
      if (r < 1) undoRaf = requestAnimationFrame(tick); else hideToast();
    })(undoStart);
  }

  function hideToast() { toast.classList.remove('show'); undoState = null; cancelAnimationFrame(undoRaf); }

  function showToast(msg) {
    undoState = null; cancelAnimationFrame(undoRaf); clearTimeout(undoTimer);
    toastMsg.textContent = msg;
    toastUndo.style.display = 'none'; document.getElementById('toast-timer').style.display = 'none';
    toast.classList.add('show');
    undoTimer = setTimeout(() => { toast.classList.remove('show'); toastUndo.style.display=''; document.getElementById('toast-timer').style.display=''; }, 2200);
  }

  toastUndo.addEventListener('click', () => {
    if (!undoState) return;
    state.counts[undoState.friendId] = undoState.prevCount;
    saveState(); renderFriends(); hideToast();
  });

  /* ── Add Modal ── */
  const addModal = document.getElementById('add-modal');
  const addInput = document.getElementById('add-input');
  document.getElementById('add-btn').addEventListener('click', () => { addInput.value=''; addModal.classList.add('open'); setTimeout(()=>addInput.focus(),80); });
  document.getElementById('add-cancel').addEventListener('click', () => addModal.classList.remove('open'));
  addModal.addEventListener('click', e => { if(e.target===addModal) addModal.classList.remove('open'); });
  function confirmAdd() {
    const name = addInput.value.trim(); if(!name){addInput.focus();return;}
    const id='f'+Date.now(); state.friends.push({id,name}); state.counts[id]=0;
    saveState(); renderFriends(); addModal.classList.remove('open'); showToast(`已新增：${name} ✅`);
  }
  document.getElementById('add-confirm').addEventListener('click', confirmAdd);
  addInput.addEventListener('keydown', e => { if(e.key==='Enter') confirmAdd(); });

  /* ── Edit Modal ── */
  const editModal = document.getElementById('edit-modal');
  const editInput = document.getElementById('edit-input');
  let editingCount = 0;
  function updateAdjDisplay() { document.getElementById('adj-count').textContent = editingCount; }
  document.getElementById('adj-minus').addEventListener('click', () => { if(editingCount>0){editingCount--;updateAdjDisplay();} });
  document.getElementById('adj-plus').addEventListener('click', () => { editingCount++;updateAdjDisplay(); });
  function openEdit(id) {
    editingId=id; const f=state.friends.find(x=>x.id===id);
    editInput.value=f.name; editingCount=state.counts[f.id]||0; updateAdjDisplay();
    editModal.classList.add('open'); setTimeout(()=>{editInput.focus();editInput.select();},80);
  }
  document.getElementById('edit-cancel').addEventListener('click', () => editModal.classList.remove('open'));
  editModal.addEventListener('click', e => { if(e.target===editModal) editModal.classList.remove('open'); });
  function confirmEdit() {
    const name=editInput.value.trim(); if(!name||!editingId){editInput.focus();return;}
    const f=state.friends.find(x=>x.id===editingId); f.name=name; state.counts[editingId]=editingCount;
    saveState(); renderFriends(); editModal.classList.remove('open'); showToast(`已更新：${name} ✅`);
  }
  function confirmDelete() {
    if(!editingId) return;
    const f=state.friends.find(x=>x.id===editingId);
    if(!confirm(`確定要刪除「${f.name}」嗎？`)) return;
    state.friends=state.friends.filter(x=>x.id!==editingId); delete state.counts[editingId];
    saveState(); renderFriends(); editModal.classList.remove('open'); showToast(`已刪除：${f.name}`);
  }
  document.getElementById('edit-confirm').addEventListener('click', confirmEdit);
  document.getElementById('edit-delete').addEventListener('click', confirmDelete);
  editInput.addEventListener('keydown', e => { if(e.key==='Enter') confirmEdit(); });

  renderFriends();
</script>
</body>
</html>
